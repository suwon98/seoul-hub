plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.seoul-hub'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Security fixes newer than the Spring Boot 4.0.8 BOM; stay on compatible lines.
ext['jackson-2-bom.version'] = '2.21.7'
ext['jackson-bom.version'] = '3.1.7'
ext['tomcat.version'] = '11.0.27'

dependencies {
    // 1. Core Web & Database Infrastructure
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // 3. Documentation (Notion 자동화를 위한 Swagger 엔진)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // 4. Code Automation (Lombok)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 5. Unified Testing Framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 6. Security & Authentication (JWT 및 패스워드 암호화 정식 장착)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 유효성 검증(비밀번호 정규식, 필수값 체크 등)을 활성화하는 라이브러리 추가
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 공공 API 통신을 위한 WebClient 웹플럭스 모듈 장착
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
tasks.register('dependencyInventory') {
    doLast {
        def dependencies = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [name: "${it.moduleVersion.id.group}:${it.name}", version: it.moduleVersion.id.version]
        }.unique()
        def output = layout.buildDirectory.file('dependency-inventory.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson(dependencies)
    }
}
