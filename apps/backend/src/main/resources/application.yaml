spring:
  application:
    name: seoul-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
seoul:
  api:
    key: ${SEOUL_API_KEY:}
  collection:
    enabled: ${SEOUL_COLLECTION_ENABLED:true}
    request-delay-ms: ${SEOUL_COLLECTION_REQUEST_DELAY_MS:0}
    daily-budget: ${SEOUL_COLLECTION_DAILY_BUDGET:900}
security:
  jwt:
    secret: ${JWT_SECRET}
  proxy-secret: ${API_PROXY_SECRET:}
app:
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

account:
  public-origin: ${APP_PUBLIC_ORIGIN:http://localhost:3000}
  mail:
    mode: ${MAIL_MODE:disabled}
    api-key: ${BREVO_API_KEY:}
    sender-email: ${MAIL_SENDER_EMAIL:}
    sender-name: ${MAIL_SENDER_NAME:Seoul Hub}
