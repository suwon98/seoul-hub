spring:
  config:
    import: optional:file:./.env.properties
  datasource:
    url: jdbc:h2:file:./data/seoul-hub;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
security:
  jwt:
    secret: local-development-only-secret-change-for-production-2026

account:
  mail:
    mode: file
