name: Seoul Hub CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test bootJar dependencyInventory
        working-directory: apps/backend
      - run: python3 scripts/audit-java.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: apps/backend/build/reports/tests
      - name: Optional Notion sync
        if: github.event_name == 'push' && vars.ENABLE_NOTION_SYNC == 'true'
        run: node scripts/sync-to-notion.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: seoul_hub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --tests '*MigrationTests'
        working-directory: apps/backend
        env:
          # Isolated loopback CI database only; production requires sslMode=verify-full.
          MIGRATION_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/seoul_hub?allowPublicKeyRetrieval=true
          MIGRATION_TEST_DB_DRIVER: org.mariadb.jdbc.Driver
          MIGRATION_TEST_DB_USER: root
          MIGRATION_TEST_DB_PASSWORD: ci-only-password
          MIGRATION_TEST_DB_DIALECT: org.seoulhub.backend.global.config.MySqlMariaDbDriverDialect
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t seoul-hub-api -f apps/backend/Dockerfile apps/backend
